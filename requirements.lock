# requirements.lock — db-mcp-server (W28A-861-R3)
#
# Fully-resolved, index-agnostic pin set (Python 3.12). Every pin is a bare
# `name==version` with NO index URL, NO --index-url / --extra-index-url, and NO
# host or credential reference — it resolves identically from the internal index
# (pypi.cloud-dog.net) today and from the public boundary once the seven
# cloud_dog_* / cloud-dog-* platform packages are mirrored there (W28A-862/863).
#
# Sealed by resolving the full dependency closure of pyproject.toml against the
# internal package index in a clean python:3.12-slim container, then `pip freeze`.
#
# SQL / NoSQL drivers are NOT direct dependencies of db-mcp-server. They enter the
# closure transitively through the cloud_dog_db[nosql,sql] OPTIONAL EXTRAS
# (W28E-606 / §1.4). The extras are preserved on the cloud_dog_db pin below
# (`cloud_dog_db[nosql,sql]==0.3.0`); the driver packages therefore appear in this
# lock only as transitive members of that closure, never as top-level project
# dependencies:
#   nosql -> pymongo, CouchDB, couchbase, cassandra-driver, elasticsearch,
#            opensearch-py  (+ their own sub-deps: dnspython, geomet,
#            elastic-transport, opensearch-protobufs, grpcio, protobuf, numpy ...)
#   sql   -> psycopg (+psycopg-binary), PyMySQL, SQLAlchemy (+greenlet), pgvector
#
# Regenerate: clean py3.12 container, `pip install <platform pkgs by name> &&
# pip install .` against any index carrying the platform packages, then
# `pip freeze` (drop the self package + pip; re-add the [nosql,sql] extras marker
# to the cloud_dog_db line).
