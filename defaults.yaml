app:
  name: "db-mcp-server"
  version: "0.1.0"
  environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"
  url: "https://dbmcp.cloud-dog.net"

service_name: "db-mcp-server"
service_instance: "${HOSTNAME || 'db-mcp-local'}"
environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"

auth:
  mode: "api_key_only"
  api_key: "${vault.dev.services.dbmcpserver0.api_key || ''}"
  default_role: "admin"
  jwt_secret: "${vault.dev.services.dbmcpserver0.jwt_secret || 'test-jwt-secret'}"

access_control:
  bootstrap_admin:
    user_id: "bootstrap-admin"
    username: "bootstrap-admin"
    display_name: "Bootstrap Admin"
    api_key_name: "bootstrap-admin-key"
  roles:
    admin:
      - "*"
    data_steward:
      - "catalog.read"
      - "schema.read"
      - "schema.change"
      - "relationship.read"
      - "relationship.change"
      - "content.search"
      - "data.read"
      - "data.create"
      - "data.update"
      - "data.delete"
      - "index.manage"
      - "profile.manage"
      - "audit.read"
    developer:
      - "catalog.read"
      - "schema.read"
      - "schema.change"
      - "relationship.read"
      - "content.search"
      - "data.read"
      - "data.create"
      - "data.update"
      - "index.manage"
    analyst:
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "content.search"
      - "data.read"
    auditor:
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "audit.read"
      - "data.read"

api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8086
  cors_origins: []

web_server:
  enabled: true
  host: "0.0.0.0"
  port: 8087
  api_base_url: "http://127.0.0.1:8086"

web_login:
  username: "${CLOUD_DOG_WEB_LOGIN_USERNAME:admin}"
  password: "${CLOUD_DOG_WEB_LOGIN_PASSWORD || ''}"

mcp_server:
  enabled: true
  host: "0.0.0.0"
  port: 8088
  transport_modes:
    - "streamable_http"
    - "http_jsonrpc"
    - "legacy_sse"

a2a_server:
  enabled: true
  host: "0.0.0.0"
  port: 8089
  websocket_path: "/a2a/ws"

metadata_store:
  uri: "${vault.dev.databases.dbmcp_metadata_postgresql.uri || 'sqlite:///./data/dbmcp_metadata.db'}"

audit_store:
  uri: "${vault.dev.databases.dbmcp_audit_postgresql.uri || 'sqlite:///./data/dbmcp_audit.db'}"

jobs:
  backend: "sql"
  sql_database_url: "${vault.dev.databases.dbmcp_jobs_postgresql.uri || 'sqlite:///./data/dbmcp_jobs.db'}"
  payload_max_bytes: 16384

search:
  enabled: true
  discovery_index_path: "./data/discovery-index.db"
  metadata_limit: 20
  content_limit: 20
  max_documents_per_entity: 10
  max_excerpt_chars: 240
  freshness_seconds: 3600
  inline_sync: true

log:
  level: "INFO"
  format: "json"
  console: true
  pii_redaction: true
  service_instance: "${HOSTNAME || 'db-mcp-local'}"
  environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"
  app_log: "logs/app.log.jsonl"
  audit_log: "logs/audit.log.jsonl"
  integrity:
    enabled: false

runtime:
  health_exempt_paths:
    - "/health"
    - "/ready"
    - "/live"
    - "/status"
    - "/docs"
    - "/redoc"
    - "/openapi.json"

connectors:
  mongodb:
    enabled: true
    default_uri: "${vault.dev.databases.mongodb.uri || ''}"
    default_host: "${vault.dev.databases.providers.mongodb.host || ''}"
    default_port: "${vault.dev.databases.providers.mongodb.port || 27017}"
    default_username: "${vault.dev.databases.providers.mongodb.username || ''}"
    default_password: "${vault.dev.databases.providers.mongodb.password || ''}"
    default_auth_database: "admin"
    default_query: "ssl=false"
    timeout_ms: 30000
  couchdb:
    enabled: true
    default_uri: "${vault.dev.databases.providers.couchdb.uri || CLOUD_DOG__CONNECTORS__COUCHDB__URI || ''}"
    default_host: "${vault.dev.databases.providers.couchdb.host || CLOUD_DOG__CONNECTORS__COUCHDB__HOST || ''}"
    default_port: "${vault.dev.databases.providers.couchdb.port || CLOUD_DOG__CONNECTORS__COUCHDB__PORT || 5984}"
    default_username: "${vault.dev.databases.providers.couchdb.username || CLOUD_DOG__CONNECTORS__COUCHDB__USERNAME || ''}"
    default_password: "${vault.dev.databases.providers.couchdb.password || CLOUD_DOG__CONNECTORS__COUCHDB__PASSWORD || ''}"
    timeout_seconds: 30
  opensearch:
    enabled: true
    default_uri: "${vault.dev.databases.providers.opensearch.uri || CLOUD_DOG__CONNECTORS__OPENSEARCH__URI || ''}"
    default_host: "${vault.dev.databases.providers.opensearch.host || CLOUD_DOG__CONNECTORS__OPENSEARCH__HOST || ''}"
    default_port: "${vault.dev.databases.providers.opensearch.port || CLOUD_DOG__CONNECTORS__OPENSEARCH__PORT || 9200}"
    default_username: "${vault.dev.databases.providers.opensearch.username || CLOUD_DOG__CONNECTORS__OPENSEARCH__USERNAME || ''}"
    default_password: "${vault.dev.databases.providers.opensearch.password || CLOUD_DOG__CONNECTORS__OPENSEARCH__PASSWORD || ''}"
    timeout_seconds: 30
  elasticsearch:
    enabled: true
    default_uri: "${vault.dev.databases.providers.elasticsearch.uri || CLOUD_DOG__CONNECTORS__ELASTICSEARCH__URI || ''}"
    default_host: "${vault.dev.databases.providers.elasticsearch.host || CLOUD_DOG__CONNECTORS__ELASTICSEARCH__HOST || ''}"
    default_port: "${vault.dev.databases.providers.elasticsearch.port || CLOUD_DOG__CONNECTORS__ELASTICSEARCH__PORT || 9200}"
    default_username: "${vault.dev.databases.providers.elasticsearch.username || CLOUD_DOG__CONNECTORS__ELASTICSEARCH__USERNAME || ''}"
    default_password: "${vault.dev.databases.providers.elasticsearch.password || CLOUD_DOG__CONNECTORS__ELASTICSEARCH__PASSWORD || ''}"
    timeout_seconds: 30
  cassandra:
    enabled: true
    default_host: "${vault.dev.databases.providers.cassandra.host || CLOUD_DOG__CONNECTORS__CASSANDRA__HOST || ''}"
    default_port: "${vault.dev.databases.providers.cassandra.port || CLOUD_DOG__CONNECTORS__CASSANDRA__PORT || 9042}"
    timeout_seconds: 30
  postgresql:
    enabled: true
    default_uri: "${CLOUD_DOG__CONNECTORS__POSTGRESQL__DEFAULT_URI || CLOUD_DOG__CONNECTORS__POSTGRESQL__URI || ''}"
    default_host: "${vault.dev.databases.providers.postgres.host || CLOUD_DOG__CONNECTORS__POSTGRESQL__HOST || ''}"
    default_port: "${vault.dev.databases.providers.postgres.port || CLOUD_DOG__CONNECTORS__POSTGRESQL__PORT || 5432}"
    default_username: "${vault.dev.databases.providers.postgres.username || CLOUD_DOG__CONNECTORS__POSTGRESQL__USERNAME || ''}"
    default_password: "${vault.dev.databases.providers.postgres.password || CLOUD_DOG__CONNECTORS__POSTGRESQL__PASSWORD || ''}"
    default_database: "${CLOUD_DOG__CONNECTORS__POSTGRESQL__DATABASE || 'cloud_dog_db_test'}"
    timeout_seconds: 30
  mariadb:
    enabled: true
    default_uri: "${CLOUD_DOG__CONNECTORS__MARIADB__DEFAULT_URI || CLOUD_DOG__CONNECTORS__MARIADB__URI || ''}"
    default_host: "${vault.dev.databases.providers.mysql.host || CLOUD_DOG__CONNECTORS__MARIADB__HOST || ''}"
    default_port: "${vault.dev.databases.providers.mysql.port || CLOUD_DOG__CONNECTORS__MARIADB__PORT || 3306}"
    default_username: "${vault.dev.databases.providers.mysql.username || CLOUD_DOG__CONNECTORS__MARIADB__USERNAME || ''}"
    default_password: "${vault.dev.databases.providers.mysql.password || CLOUD_DOG__CONNECTORS__MARIADB__PASSWORD || ''}"
    default_database: "${CLOUD_DOG__CONNECTORS__MARIADB__DATABASE || 'cloud_dog_db_test'}"
    timeout_seconds: 30
