app:
  name: "db-mcp-server"
  version: "0.1.0"
  environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"
  url: "https://dbmcp.example.com"

service_name: "db-mcp-server"
service_instance: "${HOSTNAME || 'db-mcp-local'}"
environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"

auth:
  mode: "api_key_only"
  api_key: ""
  default_role: "admin"
  jwt_secret: ""

access_control:
  bootstrap_admin:
    user_id: "bootstrap-admin"
    username: "bootstrap-admin"
    display_name: "Bootstrap Admin"
    api_key_name: "bootstrap-admin-key"
  roles:
    admin:
      - "*"
    read-write:
      - "a2a.access"
      - "apikeys.manage_own"
      - "apikeys.read_own"
      - "apidocs.access"
      - "config.read"
      - "idam.users.read"
      - "logs.read"
      - "mcp.access"
      - "profiles.read"
      - "resources:read"
      - "webui.access"
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "content.search"
      - "data.read"
      - "audit.read"
      - "schema.change"
      - "relationship.change"
      - "data.create"
      - "data.update"
      - "data.delete"
      - "index.manage"
      - "profile.manage"
    read-only:
      - "a2a.access"
      - "apikeys.manage_own"
      - "apikeys.read_own"
      - "apidocs.access"
      - "config.read"
      - "idam.users.read"
      - "logs.read"
      - "mcp.access"
      - "profiles.read"
      - "resources:read"
      - "webui.access"
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "content.search"
      - "data.read"
      - "audit.read"
    data_steward:
      - "catalog.read"
      - "schema.read"
      - "schema.change"
      - "relationship.read"
      - "relationship.change"
      - "content.search"
      - "data.read"
      - "data.create"
      - "data.update"
      - "data.delete"
      - "index.manage"
      - "profile.manage"
      - "audit.read"
    developer:
      - "catalog.read"
      - "schema.read"
      - "schema.change"
      - "relationship.read"
      - "content.search"
      - "data.read"
      - "data.create"
      - "data.update"
      - "index.manage"
    analyst:
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "content.search"
      - "data.read"
    auditor:
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "audit.read"
      - "data.read"

api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8086
  base_path: "/v1"
  cors_origins: []

web_server:
  enabled: true
  host: "0.0.0.0"
  port: 8087
  # base_path = server route prefix (PS-92). api_base_url = full client URL (existing, unchanged).
  base_path: ""
  api_base_url: "http://127.0.0.1:8086"

web_login:
  username: "${CLOUD_DOG_WEB_LOGIN_USERNAME:admin}"
  password: "${CLOUD_DOG_WEB_LOGIN_PASSWORD || ''}"

flat_login:
  demo_keys_dir: "data/flat_role_keys"

mcp_server:
  enabled: true
  host: "0.0.0.0"
  port: 8088
  base_path: "/mcp"
  transport_modes:
    - "streamable_http"
    - "http_jsonrpc"
    - "legacy_sse"

a2a_server:
  enabled: true
  host: "0.0.0.0"
  port: 8089
  base_path: "/a2a"
  websocket_path: "/a2a/ws"

metadata_store:
  uri: "sqlite:///./data/dbmcp_webui_metadata.db"

audit_store:
  uri: ""

jobs:
  backend: "sql"
  sql_database_url: ""
  payload_max_bytes: 16384
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
  timeout:
    run_timeout_ms: 300000
    claim_timeout_ms: 60000
  maintenance:
    claim_timeout_seconds: 60
    max_age_seconds: 86400
  dead_letter:
    enabled: true
    queue_name: dead_letter

search:
  enabled: true
  discovery_index_path: "./data/discovery-index.db"
  metadata_limit: 20
  content_limit: 20
  max_documents_per_entity: 10
  max_excerpt_chars: 240
  freshness_seconds: 3600
  inline_sync: true

log:
  level: "INFO"
  format: "json"
  console: true
  pii_redaction: true
  service_instance: "${HOSTNAME || 'db-mcp-local'}"
  environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"
  log_folder: "logs"
  app_log: "logs/app.log.jsonl"
  api_server_log: "logs/api_server.log"
  web_server_log: "logs/web_server.log"
  mcp_server_log: "logs/mcp_server.log"
  a2a_server_log: "logs/a2a_server.log"
  audit_log: "logs/audit.log.jsonl"
  integrity:
    enabled: true
    interval_seconds: 300
    log_file: "logs/audit-integrity.log"
    hash_algorithm: "sha256"
  rotation:
    mode: "time"
    max_bytes: 10485760
    backup_count: 10
    when: "midnight"
    interval: 1
    compress: true

runtime:
  request_timeout_seconds: 120
  health_exempt_paths:
    - "/health"
    - "/ready"
    - "/live"
    - "/status"
    - "/docs"
    - "/redoc"
    - "/openapi.json"

connectors:
  mongodb:
    enabled: true
    default_uri: ""
    default_host: ""
    default_port: "0"
    default_username: ""
    default_password: ""
    default_auth_database: "admin"
    default_query: "ssl=false"
    timeout_ms: 30000
  couchdb:
    enabled: true
    default_uri: ""
    default_host: ""
    default_port: "0"
    default_username: ""
    default_password: ""
    timeout_seconds: 30
  opensearch:
    enabled: true
    default_uri: ""
    default_host: ""
    default_port: "0"
    default_username: ""
    default_password: ""
    timeout_seconds: 30
  elasticsearch:
    enabled: true
    default_uri: ""
    default_host: ""
    default_port: "0"
    default_username: ""
    default_password: ""
    timeout_seconds: 30
  cassandra:
    enabled: true
    default_host: ""
    default_port: "0"
    timeout_seconds: 30
  postgresql:
    enabled: true
    default_uri: "${CLOUD_DOG__CONNECTORS__POSTGRESQL__DEFAULT_URI || CLOUD_DOG__CONNECTORS__POSTGRESQL__URI || ''}"
    default_host: ""
    default_port: "0"
    default_username: ""
    default_password: ""
    default_database: "${CLOUD_DOG__CONNECTORS__POSTGRESQL__DATABASE || 'cloud_dog_db_test'}"
    timeout_seconds: 30
  mariadb:
    enabled: true
    default_uri: "${CLOUD_DOG__CONNECTORS__MARIADB__DEFAULT_URI || CLOUD_DOG__CONNECTORS__MARIADB__URI || ''}"
    default_host: ""
    default_port: "0"
    default_username: ""
    default_password: ""
    default_database: "${CLOUD_DOG__CONNECTORS__MARIADB__DATABASE || 'cloud_dog_db_test'}"
    timeout_seconds: 30
