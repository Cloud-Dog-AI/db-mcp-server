app:
  name: "DB MCP Server"
  version: "0.1.0"
  environment: "development"
  url: "https://dbmcp.cloud-dog.net"

api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8086
  base_url: ""
  api_key: "${vault.dev.services.dbmcpserver0.api_key || ''}"
  cors_origins: []

web_server:
  enabled: true
  host: "0.0.0.0"
  port: 8087
  base_url: ""
  username: "${vault.dev.services.dbmcpserver0.web_username || ''}"
  password: "${vault.dev.services.dbmcpserver0.web_password || ''}"
  api_base_url: ""

mcp_server:
  enabled: true
  host: "0.0.0.0"
  port: 8088
  base_url: ""
  transport: "streamable_http"
  api_base_url: ""
  session_ttl_seconds: 3600

a2a_server:
  enabled: true
  host: "0.0.0.0"
  port: 8089
  base_url: ""
  api_base_url: ""

metadata_store:
  uri: "${vault.dev.databases.dbmcp_metadata_postgresql.uri || 'sqlite:///./data/dbmcp_metadata.db'}"
  audit_uri: "${vault.dev.databases.dbmcp_audit_postgresql.uri || 'sqlite:///./data/dbmcp_audit.db'}"

jobs:
  backend: "${vault.dev.redis.valkey0.url || 'redis://127.0.0.1:6379/0'}"
  worker_concurrency: 4
  plan_timeout_seconds: 900
  index_timeout_seconds: 1800

auth:
  mode: "api_key+jwt"
  jwt_secret: "${vault.dev.services.dbmcpserver0.jwt_secret || 'dev-only-placeholder-jwt-secret'}"
  profile_access_enforced: true

logging:
  level: "INFO"
  format: "json"
  pii_redaction: true
  service_instance: "${HOSTNAME:db-mcp-local}"
  environment: "${CLOUD_DOG_ENVIRONMENT:dev}"

structured_filters:
  max_clauses: 32
  max_sort_fields: 5
  allow_regex: false
  allow_server_side_scripts: false

connectors:
  mongodb:
    enabled: false
    uri: "${vault.dev.databases.mongodb_primary.uri || ''}"
    database: ""
    read_preference: "primaryPreferred"
  couchdb:
    enabled: false
    url: "${vault.dev.databases.couchdb_primary.url || ''}"
    database: ""
    username: "${vault.dev.databases.couchdb_primary.username || ''}"
    password: "${vault.dev.databases.couchdb_primary.password || ''}"
  opensearch:
    enabled: false
    url: "${vault.dev.vdbs.opensearch.url || ''}"
    username: "${vault.dev.vdbs.opensearch.username || ''}"
    password: "${vault.dev.vdbs.opensearch.password || ''}"
    verify_tls: true
  elasticsearch:
    enabled: false
    url: "${vault.dev.vdbs.elasticsearch.url || ''}"
    api_key: "${vault.dev.vdbs.elasticsearch.api_key || ''}"
    verify_tls: true
  cassandra:
    enabled: false
    contact_points: "${vault.dev.databases.cassandra_primary.contact_points || ''}"
    keyspace: ""
    username: "${vault.dev.databases.cassandra_primary.username || ''}"
    password: "${vault.dev.databases.cassandra_primary.password || ''}"

indexing:
  enabled: true
  backend: "${vault.dev.vdbs.qdrant.url || ''}"
  embedding_model: "${vault.dev.models.ollama_nomic_embed_text_llm1.model || 'nomic-embed-text'}"
  embedding_base_url: "${vault.dev.models.ollama_nomic_embed_text_llm1.base_url || ''}"
  batch_size: 100

relationships:
  inference_enabled: true
  max_candidates_per_entity: 25
  review_required: true
