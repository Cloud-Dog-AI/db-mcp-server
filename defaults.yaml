app:
  name: "db-mcp-server"
  version: "0.1.0"
  environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"
  url: "https://dbmcp.cloud-dog.net"

service_name: "db-mcp-server"
service_instance: "${HOSTNAME || 'db-mcp-local'}"
environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"

auth:
  mode: "api_key_only"
  api_key: "${vault.dev.services.dbmcpserver0.api_key || ''}"
  default_role: "admin"
  jwt_secret: "${vault.dev.services.dbmcpserver0.jwt_secret || 'test-jwt-secret'}"

access_control:
  bootstrap_admin:
    user_id: "bootstrap-admin"
    username: "bootstrap-admin"
    display_name: "Bootstrap Admin"
    api_key_name: "bootstrap-admin-key"
  roles:
    admin:
      - "*"
    data_steward:
      - "catalog.read"
      - "schema.read"
      - "schema.change"
      - "relationship.read"
      - "relationship.change"
      - "content.search"
      - "data.read"
      - "data.create"
      - "data.update"
      - "data.delete"
      - "index.manage"
      - "profile.manage"
      - "audit.read"
    developer:
      - "catalog.read"
      - "schema.read"
      - "schema.change"
      - "relationship.read"
      - "content.search"
      - "data.read"
      - "data.create"
      - "data.update"
      - "index.manage"
    analyst:
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "content.search"
      - "data.read"
    auditor:
      - "catalog.read"
      - "schema.read"
      - "relationship.read"
      - "audit.read"
      - "data.read"

api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8086
  cors_origins: []

web_server:
  enabled: true
  host: "0.0.0.0"
  port: 8087
  api_base_url: "http://127.0.0.1:8086"

mcp_server:
  enabled: true
  host: "0.0.0.0"
  port: 8088
  transport_modes:
    - "streamable_http"
    - "http_jsonrpc"
    - "legacy_sse"

a2a_server:
  enabled: true
  host: "0.0.0.0"
  port: 8089
  websocket_path: "/a2a/ws"

metadata_store:
  uri: "${vault.dev.databases.dbmcp_metadata_postgresql.uri || 'sqlite:///./data/dbmcp_metadata.db'}"

audit_store:
  uri: "${vault.dev.databases.dbmcp_audit_postgresql.uri || 'sqlite:///./data/dbmcp_audit.db'}"

jobs:
  backend: "memory"
  payload_max_bytes: 16384

search:
  enabled: true
  discovery_index_path: "./data/discovery-index.db"
  metadata_limit: 20
  content_limit: 20
  max_documents_per_entity: 10
  max_excerpt_chars: 240
  freshness_seconds: 3600
  inline_sync: true

log:
  level: "INFO"
  format: "json"
  console: true
  pii_redaction: true
  service_instance: "${HOSTNAME || 'db-mcp-local'}"
  environment: "${CLOUD_DOG_ENVIRONMENT || 'dev'}"
  app_log: "logs/app.log.jsonl"
  audit_log: "logs/audit.log.jsonl"
  integrity:
    enabled: false

runtime:
  health_exempt_paths:
    - "/health"
    - "/ready"
    - "/live"
    - "/status"
    - "/docs"
    - "/redoc"
    - "/openapi.json"

connectors:
  mongodb:
    enabled: true
    default_uri: "${vault.dev.databases.mongodb.uri}"
    timeout_ms: 30000
