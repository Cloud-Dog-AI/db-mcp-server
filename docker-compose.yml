version: '3.8'

services:
  db-mcp-server:
    build:
      context: .
    environment:
      - CLOUD_DOG__DBMCP__API_SERVER__PORT=8086
      - CLOUD_DOG__DBMCP__WEB_SERVER__PORT=8087
      - CLOUD_DOG__DBMCP__MCP_SERVER__PORT=8088
      - CLOUD_DOG__DBMCP__A2A_SERVER__PORT=8089
    ports:
      - "8086:8086"
      - "8087:8087"
      - "8088:8088"
      - "8089:8089"
    command: ["bash", "-lc", "echo 'db-mcp-server planning skeleton only'; exit 1"]
