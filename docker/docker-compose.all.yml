services:
  mongodb:
    image: mongo:6.0
    container_name: db-mcp-mongodb
    network_mode: host
    command: ["--bind_ip", "127.0.0.1", "--port", "27018"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27018 --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  couchdb:
    image: couchdb:3
    container_name: db-mcp-couchdb
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: cloud-dog-test
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5984/_up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: db-mcp-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: cloud-dog-test-password
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: db-mcp-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  cassandra:
    image: cassandra:4.1
    container_name: db-mcp-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: db-mcp-test
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s

  mongodb-seed:
    image: python:3.10-slim
    container_name: db-mcp-mongodb-seed
    restart: "no"
    network_mode: host
    depends_on:
      mongodb:
        condition: service_healthy
    working_dir: /workspace/db-mcp-server
    volumes:
      - ..:/workspace/db-mcp-server
    environment:
      DB_MCP_TEST_MONGODB_URI: mongodb://127.0.0.1:27018
      DB_MCP_TEST_MONGODB_DB: dbmcp_ecommerce
    command: >-
      bash -lc "pip install --no-cache-dir pymongo requests >/tmp/pip.log 2>&1 &&
      python -m tests.fixtures.mongodb_seed"

  couchdb-seed:
    image: python:3.10-slim
    container_name: db-mcp-couchdb-seed
    restart: "no"
    depends_on:
      couchdb:
        condition: service_healthy
    working_dir: /workspace/db-mcp-server
    volumes:
      - ..:/workspace/db-mcp-server
    environment:
      DB_MCP_TEST_COUCHDB_URL: http://couchdb:5984
      DB_MCP_TEST_COUCHDB_PREFIX: dbmcp_ecommerce
      DB_MCP_TEST_COUCHDB_USERNAME: admin
      DB_MCP_TEST_COUCHDB_PASSWORD: cloud-dog-test
    command: >-
      bash -lc "pip install --no-cache-dir requests >/tmp/pip.log 2>&1 &&
      python -m tests.fixtures.couchdb_seed"

  opensearch-seed:
    image: python:3.10-slim
    container_name: db-mcp-opensearch-seed
    restart: "no"
    depends_on:
      opensearch:
        condition: service_healthy
    working_dir: /workspace/db-mcp-server
    volumes:
      - ..:/workspace/db-mcp-server
    environment:
      DB_MCP_TEST_OPENSEARCH_URL: http://opensearch:9200
      DB_MCP_TEST_OPENSEARCH_PREFIX: dbmcp_ecommerce
    command: >-
      bash -lc "pip install --no-cache-dir requests >/tmp/pip.log 2>&1 &&
      python -m tests.fixtures.opensearch_seed"

  elasticsearch-seed:
    image: python:3.10-slim
    container_name: db-mcp-elasticsearch-seed
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    working_dir: /workspace/db-mcp-server
    volumes:
      - ..:/workspace/db-mcp-server
    environment:
      DB_MCP_TEST_ELASTICSEARCH_URL: http://elasticsearch:9200
      DB_MCP_TEST_OPENSEARCH_PREFIX: dbmcp_ecommerce
    command: >-
      bash -lc "pip install --no-cache-dir requests >/tmp/pip.log 2>&1 &&
      python -m tests.fixtures.elasticsearch_seed"

  cassandra-seed:
    image: python:3.10-slim
    container_name: db-mcp-cassandra-seed
    restart: "no"
    depends_on:
      cassandra:
        condition: service_healthy
    working_dir: /workspace/db-mcp-server
    volumes:
      - ..:/workspace/db-mcp-server
    environment:
      DB_MCP_TEST_CASSANDRA_HOST: cassandra
      DB_MCP_TEST_CASSANDRA_PORT: '9042'
      DB_MCP_TEST_CASSANDRA_KEYSPACE: dbmcp_ecommerce
      DB_MCP_TEST_CASSANDRA_USERNAME: cassandra
      DB_MCP_TEST_CASSANDRA_PASSWORD: cassandra
    command: >-
      bash -lc "pip install --no-cache-dir cassandra-driver >/tmp/pip.log 2>&1 &&
      python -m tests.fixtures.cassandra_seed"

volumes:
  mongodb-data:
  couchdb-data:
  opensearch-data:
  elasticsearch-data:
  cassandra-data:
