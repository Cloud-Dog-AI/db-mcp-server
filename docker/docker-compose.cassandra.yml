# ⛔ DO NOT USE — Use existing Terraform-managed infrastructure instead.
# See AGENT-LESSONS.md lesson 25 and Bootstrap Directive §3.2.3.
# Databases: mongo0, couchdb0, elastic0, cassandra0, db1 (MariaDB), db2 (PostgreSQL)
# These docker-compose files are DEPRECATED and must NOT be used to spin up test databases.
services:
  cassandra:
    image: cassandra:4.1
    container_name: db-mcp-cassandra
    network_mode: host
    environment:
      CASSANDRA_CLUSTER_NAME: db-mcp-test
      CASSANDRA_SEEDS: 127.0.0.1
      CASSANDRA_LISTEN_ADDRESS: 127.0.0.1
      CASSANDRA_RPC_ADDRESS: 127.0.0.1
      CASSANDRA_BROADCAST_ADDRESS: 127.0.0.1
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra-seed:
    image: python:3.10-slim
    container_name: db-mcp-cassandra-seed
    restart: "no"
    network_mode: host
    depends_on:
      cassandra:
        condition: service_healthy
    working_dir: /workspace/db-mcp-server
    volumes:
      - ..:/workspace/db-mcp-server
    environment:
      DB_MCP_TEST_CASSANDRA_HOST: 127.0.0.1
      DB_MCP_TEST_CASSANDRA_PORT: '9042'
      DB_MCP_TEST_CASSANDRA_KEYSPACE: dbmcp_ecommerce
      DB_MCP_TEST_CASSANDRA_USERNAME: cassandra
      DB_MCP_TEST_CASSANDRA_PASSWORD: cassandra
    command: >-
      bash -lc "pip install --no-cache-dir cassandra-driver >/tmp/pip.log 2>&1 &&
      python -m tests.fixtures.cassandra_seed"

volumes:
  cassandra-data:
