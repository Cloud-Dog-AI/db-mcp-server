version: '3.8'

services:
  db-mcp-server:
    build:
      context: ..
      dockerfile: db-mcp-server/Dockerfile
    environment:
      DB_MCP_SERVER_ENV_FILE: tests/env-ST
      CLOUD_DOG__AUTH__API_KEY: test-api-key
    ports:
      - "8086:8086"
      - "8087:8087"
      - "8088:8088"
      - "8089:8089"
    command: ["bash", "-lc", "./server_control.sh --env tests/env-ST start all && tail -f logs/api.log logs/web.log logs/mcp.log logs/a2a.log"]
