# ⛔ DO NOT USE — Use existing Terraform-managed infrastructure instead.
# See AGENT-LESSONS.md lesson 25 and Bootstrap Directive §3.2.3.
# Databases: mongo0, couchdb0, elastic0, cassandra0, db1 (MariaDB), db2 (PostgreSQL)
# These docker-compose files are DEPRECATED and must NOT be used to spin up test databases.
services:
  mongodb:
    image: mongo:6.0
    container_name: db-mcp-mongodb
    network_mode: host
    command: ["--bind_ip", "127.0.0.1", "--port", "27018"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27018 --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongodb-seed:
    image: python:3.13-slim
    container_name: db-mcp-mongodb-seed
    restart: "no"
    network_mode: host
    depends_on:
      mongodb:
        condition: service_healthy
    working_dir: /workspace/db-mcp-server
    volumes:
      - ..:/workspace/db-mcp-server
    environment:
      DB_MCP_TEST_MONGODB_URI: mongodb://127.0.0.1:27018
      DB_MCP_TEST_MONGODB_DB: dbmcp_ecommerce
    command: >-
      bash -lc "pip install --no-cache-dir pymongo requests >/tmp/pip.log 2>&1 &&
      python -m tests.fixtures.mongodb_seed"

volumes:
  mongodb-data:
