[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-mcp-server"
version = "0.1.0"
description = "Planning skeleton for Cloud-Dog AI db-mcp-server."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cloud-Dog, Viewdeck Engineering Limited" }
]
dependencies = [
  "cloud-dog-config>=0.2.0",
  "cloud-dog-logging>=0.2.0",
  "cloud-dog-api-kit>=0.2.0",
  "cloud-dog-idam>=0.2.0",
  "cloud-dog-jobs>=0.2.0",
  "cloud-dog-db>=0.1.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pymongo>=4.6.0",
  "couchdb>=1.2",
  "opensearch-py>=2.4.0",
  "elasticsearch>=8.12.0",
  "cassandra-driver>=3.29.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-timeout>=2.3.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cloud_dog_config"
markers = [
  "quality: QT tier",
  "unit: UT tier",
  "system: ST tier",
  "integration: IT tier",
  "application: AT tier",
  "db: requires live database/search backend",
  "mcp: requires live MCP runtime",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "defaults.yaml",
  "README.md",
  "RULES.md",
  "docs/**",
]
