[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-mcp-server"
version = "0.1.1RC1"
description = "Cloud-Dog AI db-mcp-server runtime skeleton."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cloud-Dog, Viewdeck Engineering Limited" }
]
dependencies = [
  "cloud_dog_config>=0.3.1",
    "cloud_dog_logging>=0.3.3",
  "cloud_dog_api_kit==0.12.4",
  "cloud_dog_idam>=0.2.0",
  "cloud_dog_jobs>=0.3.0",
  "cloud_dog_db>=0.1.0",
  "cloud-dog-storage>=0.1.1",
  "alembic>=1.13.0",
  "argon2-cffi>=23.1.0",
  "couchdb>=1.2",
  "cryptography>=42.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "websockets>=12.0",
  "pyjwt>=2.8.0",
  "pydantic>=2.6.0",
  "cassandra-driver>=3.28",
  "elasticsearch>=8.0,<9.0",
  "opensearch-py>=2.0",
  "psycopg[binary]>=3.1.0",
  "pymysql>=1.1.0",
  "pymongo>=4.0.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "httpx>=0.27.0",
  "hvac>=2.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "cassandra-driver>=3.29.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-timeout>=2.3.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "playwright>=1.44.0",
]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
markers = [
  "quality: QT tier",
  "unit: UT tier",
  "system: ST tier",
  "integration: IT tier",
  "application: AT tier",
  "db: requires live database/search backend",
  "mcp: requires live MCP runtime",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "defaults.yaml",
  "README.md",
  "RULES.md",
  "docs/**",
  "docker/**",
  "start_api_server.py",
  "start_web_server.py",
  "start_mcp_server.py",
  "start_a2a_server.py",
  "server_control.sh",
  "scripts/**",
  "Dockerfile",
  "docker-compose.yml",
  "docker-build.sh",
]
